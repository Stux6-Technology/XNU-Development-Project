name: XNU Tooling CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tooling:
    name: Tooling and Script Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build devtools image
        run: docker build -f docker/Dockerfile.devtools -t xnu-devtools:tooling .

      - name: Validate maintenance scripts
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace xnu-devtools:tooling bash -lc '
            set -euo pipefail
            bash -n scripts/build-xnu.sh scripts/analyze-in-docker.sh
            python3 -m compileall -q \
              api.test.py \
              san/tools \
              tools/entropy_health_test_bounds.py \
              tools/symbolify.py \
              tools/trace/parse_ipc_trace.py \
              libkern/kxld/tests/loadtest.py
          '
